<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">Eduardo Córdova — Creative Developer</title>
  <desc id="description">Animated dark profile banner with violet, pink and cyan accents.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090713" />
      <stop offset="0.52" stop-color="#151027" />
      <stop offset="1" stop-color="#090c18" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" />
      <stop offset="0.5" stop-color="#ec4899" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".38" />
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".24" />
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#ffffff" stroke-opacity=".045" />
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="frameClip">
      <rect x="1" y="1" width="1198" height="438" rx="28" />
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <rect width="1200" height="440" fill="url(#background)" />
    <rect width="1200" height="440" fill="url(#grid)" />
    <circle cx="235" cy="85" r="250" fill="url(#violetGlow)">
      <animate attributeName="r" values="230;275;230" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="1040" cy="350" r="280" fill="url(#cyanGlow)">
      <animate attributeName="cx" values="1000;1070;1000" dur="11s" repeatCount="indefinite" />
    </circle>

    <path d="M-80 365C170 292 284 452 520 349S881 221 1290 302" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".46" stroke-dasharray="12 16">
      <animate attributeName="stroke-dashoffset" values="0;-112" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M-40 394C187 321 338 471 554 379S919 247 1260 331" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity=".09" />

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <text x="72" y="102" fill="#c4b5fd" font-size="15" font-weight="700" letter-spacing="6">CREATIVE DEVELOPER</text>
      <rect x="72" y="122" width="86" height="4" rx="2" fill="url(#accent)" />

      <text x="68" y="221" fill="#ffffff" font-size="78" font-weight="800" letter-spacing="-2">EDUARDO</text>
      <text x="68" y="296" fill="url(#accent)" font-size="78" font-weight="800" letter-spacing="-2">CÓRDOVA</text>

      <text x="72" y="345" fill="#ddd6fe" font-size="17" font-weight="600" letter-spacing="2.2">FRONTEND  •  FULL-STACK  •  MOTION  •  3D</text>
      <text x="72" y="382" fill="#94a3b8" font-size="15" letter-spacing=".8">I turn structure into experience.</text>
    </g>

    <g transform="translate(962 218)">
      <circle r="112" fill="none" stroke="#ffffff" stroke-opacity=".08" />
      <circle r="82" fill="none" stroke="url(#accent)" stroke-opacity=".42" stroke-dasharray="9 13">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="22s" repeatCount="indefinite" />
      </circle>
      <circle r="50" fill="#11101f" stroke="#a78bfa" stroke-opacity=".55" />
      <circle r="8" fill="#ec4899" filter="url(#softGlow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M0,-82 A82,82 0 1,1 -1,-82" />
      </circle>
      <circle r="5" fill="#22d3ee" filter="url(#softGlow)">
        <animateMotion dur="5s" repeatCount="indefinite" path="M0,-112 A112,112 0 1,0 1,-112" />
      </circle>
      <path d="M-18 5l12 12 27-31" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <text x="0" y="145" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4">BUILD • REFINE • SHIP</text>
    </g>

    <g fill="#ffffff">
      <circle cx="824" cy="74" r="2" opacity=".4"><animate attributeName="opacity" values=".25;1;.25" dur="3s" repeatCount="indefinite" /></circle>
      <circle cx="1110" cy="96" r="2" opacity=".5"><animate attributeName="opacity" values="1;.2;1" dur="4.2s" repeatCount="indefinite" /></circle>
      <circle cx="755" cy="156" r="1.5" opacity=".35"><animate attributeName="opacity" values=".2;.85;.2" dur="2.5s" repeatCount="indefinite" /></circle>
      <circle cx="1074" cy="385" r="2" opacity=".4"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" repeatCount="indefinite" /></circle>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="438" rx="28" fill="none" stroke="url(#accent)" stroke-opacity=".7" stroke-width="2" />
</svg>
